<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video 01 Slides</title>
<link rel="stylesheet" href="../assets/slides.css">
</head>
<body data-video-number="01" data-video-title="Finding a studio" data-parts="Introduction|The studio list|Sorting and filtering|Edge states|On a phone|Recap">

<section id="title" class="title" data-part="0">
  <div class="kicker">ShotThere MVP mocks · Video 01</div>
  <h1>Finding a studio</h1>
  <div class="row">
    <figure><img src="img/list-default.jpg" alt=""></figure>
    <figure class="phone"><img src="img/list-phone.jpg" alt=""></figure>
  </div>
</section>

<section id="list" data-part="1" data-cue="The studio list is the front door">
  <div class="row"><figure><img src="img/list-default.jpg" alt=""><figcaption>/studios</figcaption></figure></div>
</section>

<section id="sorted" data-part="1" data-cue="Five studios are published in the mocks">
  <div class="row"><figure><img src="img/list-default.jpg" alt=""><figcaption>Most recent review first</figcaption></figure></div>
</section>

<section id="card" data-part="1" data-cue="Each card carries the same facts">
  <div class="row"><figure><img src="img/card-parkdale.jpg" alt=""><figcaption>All-in · 2 hours · score</figcaption></figure></div>
</section>

<section id="stale" data-part="1" data-cue="Look at Junction Cyc Studio">
  <div class="row"><figure><img src="img/card-junction.jpg" alt=""><figcaption class="warn">Prices may be out of date</figcaption></figure></div>
</section>

<section id="compare-button" data-part="1" data-cue="Every card also has a Compare button">
  <div class="row">
    <figure><img src="img/card-parkdale.jpg" alt=""></figure>
    <figure><img src="img/card-junction.jpg" alt=""></figure>
  </div>
</section>

<section id="sort" data-part="2" data-cue="Above the results sits the count and the sort">
  <div class="row"><figure><img src="img/sort.jpg" alt=""><figcaption>3 sort orders</figcaption></figure></div>
</section>

<section id="filters" data-part="2" data-cue="The filters sit beside the results on a wide screen">
  <div class="row">
    <figure><img src="img/filters-a.jpg" alt=""></figure>
    <figure><img src="img/filters-b.jpg" alt=""></figure>
  </div>
</section>

<section id="filtered" data-part="2" data-cue="Here, the visitor has set a maximum">
  <div class="row"><figure><img src="img/filtered.jpg" alt=""><figcaption>2 applied · 2 studios</figcaption></figure></div>
</section>

<section id="url" data-part="2" data-cue="The whole view lives in the address bar">
  <div class="row"><figure><img src="img/filtered.jpg" alt=""><figcaption>/studios?costMax=160&amp;light=medium&amp;sort=cost</figcaption></figure></div>
</section>

<section id="loading" data-part="3" data-cue="When results are not normal">
  <div class="row"><figure><img src="img/loading.jpg" alt=""><figcaption>Loading</figcaption></figure></div>
</section>

<section id="no-results" data-part="3" data-cue="If nothing matches">
  <div class="row"><figure><img src="img/no-results.jpg" alt=""><figcaption>No results</figcaption></figure></div>
</section>

<section id="error" data-part="3" data-cue="If the server fails">
  <div class="row"><figure><img src="img/error.jpg" alt=""><figcaption class="warn">Error</figcaption></figure></div>
</section>

<section id="empty" data-part="3" data-cue="And before any review is published">
  <div class="row"><figure><img src="img/empty.jpg" alt=""><figcaption>Empty</figcaption></figure></div>
</section>

<section id="phone-menu" data-part="4" data-cue="On a phone">
  <div class="row">
    <figure class="phone"><img src="img/list-phone.jpg" alt=""><figcaption>Closed</figcaption></figure>
    <figure class="phone"><img src="img/phone-menu.jpg" alt=""><figcaption>Menu open</figcaption></figure>
  </div>
</section>

<section id="phone-filters" data-part="4" data-cue="The filters become a single collapsible panel">
  <div class="row"><figure class="phone"><img src="img/list-phone.jpg" alt=""><figcaption>Filters panel</figcaption></figure></div>
</section>

<section id="recap" data-part="5" data-cue="Things to remember">
  <div class="row">
    <figure><img src="img/card-parkdale.jpg" alt=""><figcaption>Same facts</figcaption></figure>
    <figure><img src="img/card-junction.jpg" alt=""><figcaption>Stale flagged</figcaption></figure>
    <figure><img src="img/filtered.jpg" alt=""><figcaption>State in the link</figcaption></figure>
    <figure><img src="img/no-results.jpg" alt=""><figcaption>Every state explained</figcaption></figure>
  </div>
</section>

</body>
</html>
