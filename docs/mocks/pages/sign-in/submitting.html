<meta charset="utf-8">

<title>Owner sign-in · submitting — ShotThere mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="sign-in">
<meta name="mock:state" content="submitting">
<meta name="mock:requirements" content="L2-049 L2-050 L2-051 L2-052">
<meta name="description" content="Sign in in flight: both fields still visible and read-only, the Sign in button busy and disabled.">

<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" href="../home/default.html">ShotThere</a>
</header>

<main id="main" class="auth" tabindex="-1">
  <div class="auth__head">
    <h1>Sign in</h1>
    <p class="subtitle">Owner access to the ShotThere administration area.</p>
  </div>
  <form class="stack" action="../admin-dashboard/default.html" method="post" novalidate>
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input class="input input--lg" id="email" name="email" type="email" autocomplete="username" spellcheck="false" value="owner@shotthere.ca" readonly>
    </div>
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <span class="input-group">
        <input class="input input--lg" id="password" name="password" type="password" autocomplete="current-password" style="flex: 1; min-width: 0;" value="north-light-2026" readonly>
        <button class="btn btn--lg" type="button" aria-pressed="false" aria-controls="password" disabled>Show<span class="visually-hidden"> password</span></button>
      </span>
    </div>
    <div style="margin-top: var(--space-2);">
      <button class="btn btn--primary btn--lg btn--block" type="submit" aria-busy="true" disabled>Signing in</button>
      <p class="visually-hidden" role="status">Signing in</p>
    </div>
  </form>
</main>

  </ul>
  <button type="button" data-theme-toggle aria-pressed="false">☾ Dark</button>
  <button type="button" data-chrome-toggle aria-label="Hide mock chrome">×</button>
</nav>
<script src="../../assets/mock.js"></script>
</body>
</html>
