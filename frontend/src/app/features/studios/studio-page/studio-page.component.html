@if (state().status === 'not-found') {
  <st-not-found-page />
}
@if (studio(); as s) {
  <article class="review">
    <st-studio-basics [basics]="s.basics" />
    <div class="review-main">
      <st-studio-pricing [pricing]="s.pricing" />
      <st-studio-specifications [specifications]="s.specifications" />
      <st-studio-gear [gear]="s.gear" />
      <st-studio-logistics [logistics]="s.logistics" />
      <st-studio-test-shots [testShots]="s.testShots" />
      <st-studio-gallery [gallery]="s.gallery" [studioName]="s.basics.name" />
      <st-studio-verdict [verdict]="s.verdict">
        <st-studio-disclosure [disclosure]="s.disclosure" />
      </st-studio-verdict>
      @if (s.episode; as episode) {
        <st-studio-episode [episode]="episode" />
      }
    </div>
  </article>
}
