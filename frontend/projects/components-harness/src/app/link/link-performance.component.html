<main class="container stack">
  <h1>Best studios under $120 for 2 hours</h1>
  <ol class="stack">
    @for (studio of studios; track studio) {
      <li class="stack">
        <h2>{{ studio }}</h2>
        <p>
          Even north light all afternoon. Tell us at
          <a st-link href="mailto:corrections@shotthere.ca">corrections&#64;shotthere.ca</a> if
          anything changed.
        </p>
        <a st-link standalone href="/studios"
          >Read the full review<span class="visually-hidden"> of {{ studio }}</span></a
        >
        <a st-link external href="https://www.youtube.com/watch?v=Jx7Lq2pT9aE">Watch on YouTube</a>
      </li>
    }
  </ol>
</main>
