<main class="container stack">
  <section aria-label="gallery photo" class="shot"><st-responsive-image [image]="gallery" [sizes]="gallerySizes" /></section>
  <section aria-label="two formats" class="shot"><st-responsive-image [image]="twoFormats" [sizes]="gallerySizes" /></section>
  <section aria-label="hero" class="hero"><st-responsive-image [image]="hero" sizes="(min-width: 80rem) 1280px, 100vw" priority /></section>
  <section aria-label="card photo" class="card"><st-responsive-image [image]="card" sizes="20rem" decorative /></section>
</main>
