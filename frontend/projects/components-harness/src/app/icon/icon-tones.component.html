<main class="container stack">
  <section aria-label="warning alert">
    <div class="alert">
      <st-icon name="warning" />
      <p>Prices may be out of date</p>
    </div>
  </section>
  <section aria-label="error circle">
    <div class="empty__icon"><st-icon name="danger" size="xl" /></div>
    <p>We couldn't load the studios</p>
  </section>
  <section aria-label="success toast">
    <div class="toast">
      <st-icon name="success" />
      <p>Link copied</p>
    </div>
  </section>
</main>
