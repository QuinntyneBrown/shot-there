<main class="container stack">
  <div class="cluster">
    <button st-button variant="ghost" type="button"><st-icon name="menu" />Menu</button>
    <button st-filter-trigger type="button" aria-expanded="false">Filters</button>
  </div>
  <div class="cluster">
    @for (chip of chips; track chip) {
      <button st-icon-button icon="close" [label]="'Remove filter: ' + chip" type="button"></button>
    }
  </div>
  <div class="cluster">
    <button st-button type="button"><st-icon name="refresh" />Try again</button>
    <button st-button variant="ghost" type="button" aria-label="Close"><st-icon name="close" /></button>
    <a st-button variant="primary" href="https://thejunctionloft.example/book" target="_blank" rel="noopener">Book on the studio's site<st-icon name="external" /><span class="visually-hidden"> (opens in a new tab)</span></a>
  </div>
</main>
