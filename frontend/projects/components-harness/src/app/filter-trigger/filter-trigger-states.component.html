<main class="container stack">
  <section aria-label="none">
    <button st-filter-trigger type="button" [attr.aria-expanded]="expanded()" (click)="toggle()">Filters</button>
  </section>
  <section aria-label="count">
    <button st-filter-trigger type="button" aria-expanded="false" count="2">Filters</button>
  </section>
  <section aria-label="disabled">
    <button st-filter-trigger type="button" aria-expanded="false" disabled>Filters</button>
  </section>
  <st-activation-log [entries]="log()" />
</main>
