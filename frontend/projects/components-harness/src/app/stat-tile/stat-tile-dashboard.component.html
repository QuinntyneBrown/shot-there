<main class="container">
  <section aria-labelledby="content-title">
    <h2 class="visually-hidden" id="content-title">Content</h2>
    <ul st-stat-grid>
      <li st-stat-tile title="Studios" counts="7 published, 2 draft" link="/admin/studios" [headingLevel]="3">
        <a st-button variant="primary" href="/admin/studios/new"><st-icon name="plus" />New studio</a>
      </li>
      <li st-stat-tile title="Spots" counts="5 published, 1 draft" link="/admin/spots" [headingLevel]="3">
        <a st-button href="/admin/spots/new"><st-icon name="plus" />New spot</a>
      </li>
      <li st-stat-tile title="Guides" counts="3 published, 1 draft" [headingLevel]="3">
        <a st-button href="/admin/guides/new"><st-icon name="plus" />New guide</a>
      </li>
    </ul>
  </section>
</main>
