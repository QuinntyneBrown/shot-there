<st-field-label
  [for]="id()"
  [label]="label()"
  [suffix]="labelSuffix()"
  [optional]="optional()"
  [optionalLabel]="optionalLabel()"
/>
<select
  class="select"
  [class.input--sm]="size() === 'sm'"
  [class.input--lg]="size() === 'lg'"
  [id]="id()"
  [attr.name]="name() || null"
  [disabled]="disabled()"
  [attr.aria-invalid]="hasError() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  (change)="chosen($event)"
  (blur)="touch()"
>
  @for (option of options(); track option.value) {
    <option
      [value]="option.value"
      [selected]="option.value === value()"
      [disabled]="option.disabled"
    >
      {{ option.label }}
    </option>
  }
</select>
<st-field-messages [id]="id()" [error]="error()" [warning]="warning()" [help]="help()" />
