<section class="review-section" aria-labelledby="gear">
  <h2 id="gear" i18n>Gear</h2>
  <h3 i18n>Included in the hourly rate</h3>
  <st-description-list [items]="included()" />
  <h3 i18n>Costs extra</h3>
  @if (gear().extras.length === 0) {
    <p i18n>Nothing costs extra at this studio.</p>
  } @else {
    <st-description-list [items]="extras()" />
  }
</section>
