@let s = studio();
<st-location-card
  [name]="s.name"
  [link]="viewModel().link"
  [image]="viewModel().image"
  [priority]="eager()"
  [meta]="viewModel().meta"
  [facts]="viewModel().facts"
  [badge]="viewModel().badge"
>
  <st-compare-toggle slot="actions" i18n-slot [slug]="s.slug" [name]="s.name" />
</st-location-card>
