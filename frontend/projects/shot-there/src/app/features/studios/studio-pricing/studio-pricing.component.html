@let p = pricing();
@let v = view();
<section class="review-section" aria-labelledby="pricing">
  <h2 id="pricing" i18n>Pricing</h2>
  <st-price-block
    [allIn]="v.allIn"
    [allInText]="v.allInText"
    [items]="v.items"
    [verifiedLabel]="v.verifiedLabel"
    [verified]="v.verified"
  >
    @if (p.priceStale) {
      <st-alert tone="warning" i18n-tone role="status" title="Prices may be out of date" i18n-title i18n>We last checked these prices {{ v.daysSinceVerified }} days ago. Confirm with the studio before you book.</st-alert>
    }
  </st-price-block>
</section>
