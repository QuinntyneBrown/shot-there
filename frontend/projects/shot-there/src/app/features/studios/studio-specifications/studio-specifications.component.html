@let v = view();
<section class="review-section" aria-labelledby="specs">
  <h2 id="specs" i18n>Measured specifications</h2>
  <st-description-list [items]="facts()" />
  <h3 id="specs-light" i18n>Natural light by time of day</h3>
  <ul class="light-grid" aria-labelledby="specs-light">
    @for (slot of v.light; track slot.time) {
      <li class="light-grid__item">
        <span class="light-grid__time">{{ slot.time }}</span>&ngsp;<st-light-rating [level]="slot.rating" [text]="slot.label" />
      </li>
    }
  </ul>
</section>
