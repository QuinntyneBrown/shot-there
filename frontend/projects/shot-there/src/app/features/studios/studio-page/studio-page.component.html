@if (state().status === 'not-found') {
  <app-not-found-page />
}
@if (studio(); as s) {
  <article class="review">
    <app-studio-basics [basics]="s.basics" />
    <div class="review-actions"><app-compare-toggle [slug]="s.slug" [name]="s.basics.name" /></div>
    <div class="review-main">
      <app-studio-pricing [pricing]="s.pricing" />
      <app-studio-specifications [specifications]="s.specifications" />
      <app-studio-gear [gear]="s.gear" />
      <app-studio-logistics [logistics]="s.logistics" />
      <app-studio-test-shots [testShots]="s.testShots" />
      <app-studio-gallery [gallery]="s.gallery" [studioName]="s.basics.name" />
      <app-studio-verdict [verdict]="s.verdict">
        <app-studio-disclosure [disclosure]="s.disclosure" />
      </app-studio-verdict>
      @if (s.episode; as episode) {
        <app-studio-episode [episode]="episode" />
      }
    </div>
  </article>
}
