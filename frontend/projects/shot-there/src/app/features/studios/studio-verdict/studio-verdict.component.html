@let v = verdict();
<section class="review-section" aria-labelledby="verdict">
  <h2 id="verdict" i18n>Verdict</h2>
  <st-score-overall [value]="(v.overallScore | number: '1.1-1') ?? ''" maxText="overall, out of 5" i18n-maxText />
  <st-score-list label="Rubric scores" i18n-label [scores]="scores()" />
  <dl class="regions">
    <div><dt i18n>Who it's for</dt><dd>{{ v.whoItsFor }}</dd></div>
    <div><dt i18n>Who should skip it</dt><dd>{{ v.whoShouldSkip }}</dd></div>
  </dl>
  <ng-content />
</section>
