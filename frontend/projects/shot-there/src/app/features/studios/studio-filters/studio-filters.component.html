@let q = query();
@let id = idPrefix();

<section class="filter-section">
  <h3 class="filter-section__title" i18n>All-in cost for 2 hours</h3>
  <st-text-field
    [inputId]="id + '-cost-min'"
    label="Minimum"
    i18n-label
    type="number"
    inputmode="decimal"
    min="0"
    step="10"
    autocomplete="off"
    prefix="$"
    [ngModel]="q.costMin?.toString() ?? ''"
    [ngModelOptions]="standaloneNgModel"
    (ngModelChange)="setCost('costMin', $event)"
  />
  <st-text-field
    [inputId]="id + '-cost-max'"
    label="Maximum"
    i18n-label
    type="number"
    inputmode="decimal"
    min="0"
    step="10"
    autocomplete="off"
    prefix="$"
    [error]="costError()"
    [ngModel]="q.costMax?.toString() ?? ''"
    [ngModelOptions]="standaloneNgModel"
    (ngModelChange)="setCost('costMax', $event)"
  />
</section>

<st-checkbox-group
  [inputId]="id + '-neighbourhoods'"
  label="Neighbourhood"
  i18n-label
  [appearance]="'filter'"
  [options]="neighbourhoodOptions"
  [ngModel]="q.neighbourhoods"
  [ngModelOptions]="standaloneNgModel"
  (ngModelChange)="setNeighbourhoods($event)"
/>

<section class="filter-section">
  <h3 class="filter-section__title" i18n>Space and light</h3>
  <div class="filter-section__choices">
    <st-checkbox
      label="Natural light"
      i18n-label
      description="At least medium at some time of day"
      i18n-description
      [ngModel]="q.naturalLight"
      [ngModelOptions]="standaloneNgModel"
      (ngModelChange)="update({ naturalLight: $event })"
    />
    <st-checkbox
      label="Cyc wall"
      i18n-label
      [ngModel]="q.cycWall"
      [ngModelOptions]="standaloneNgModel"
      (ngModelChange)="update({ cycWall: $event })"
    />
  </div>
  <st-select
    class="filter-section__select"
    [inputId]="id + '-space'"
    label="Minimum usable space"
    i18n-label
    [options]="spaceOptions"
    [ngModel]="q.minSpaceSqm?.toString() ?? ''"
    [ngModelOptions]="standaloneNgModel"
    (ngModelChange)="setSpace($event)"
  />
</section>

<st-checkbox-group
  [inputId]="id + '-gear'"
  label="Included gear"
  i18n-label
  [appearance]="'filter'"
  [options]="gearOptions"
  [ngModel]="q.gear"
  [ngModelOptions]="standaloneNgModel"
  (ngModelChange)="setGear($event)"
/>

<st-radio-group
  [inputId]="id + '-parking'"
  label="Parking"
  i18n-label
  [appearance]="'filter'"
  [options]="parkingOptions"
  [ngModel]="q.parking ?? ''"
  [ngModelOptions]="standaloneNgModel"
  (ngModelChange)="setParking($event)"
/>
