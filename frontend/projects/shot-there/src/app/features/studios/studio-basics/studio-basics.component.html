@let b = basics();
<header class="review-head">
  <h1>{{ b.name }}</h1>
  <ul class="review-head__meta">
    <li>{{ b.neighbourhood }}</li>
    <li>{{ b.addressOrCrossStreets }}</li>
  </ul>
  <div>
    <a class="btn btn--primary" [href]="b.bookingUrl" target="_blank" rel="noopener">
      <ng-container i18n>Book on the studio's site</ng-container>
      <st-icon name="external" />
      <span class="visually-hidden" i18n> (opens in a new tab)</span>
    </a>
  </div>
</header>
