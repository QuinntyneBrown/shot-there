<st-sheet title="Filters" i18n-title>
  <form id="studio-filters-form" (submit)="$event.preventDefault(); apply()">
    <p class="subtitle" id="studio-filters-description" i18n>Choose what matters for this shoot. The list updates when you show the results.</p>
    <st-select label="Sort by" i18n-label inputId="dialog-sort" i18n-inputId name="sort" [options]="sortOptions" [ngModel]="draft().sort" (ngModelChange)="setSort($event)" />
    <st-studio-filters [idPrefix]="'dialog'" [query]="draft()" [costError]="costError()" (queryChange)="draft.set($event)" />
  </form>
  <button slot="footer" i18n-slot st-button class="filters-dialog__action" type="button" (click)="clearAll()" i18n>Clear all</button>
  <button slot="footer" i18n-slot st-button class="filters-dialog__action" variant="primary" type="submit" form="studio-filters-form" [disabled]="costError() !== null" [attr.aria-describedby]="costError() ? 'dialog-cost-max-error' : null">
    @if (costError() === null && matchCount() !== null) {
      <ng-container i18n>{matchCount(), plural, =1 {Show 1 studio} other {Show {{matchCount()}} studios}}</ng-container>
    } @else {
      <ng-container i18n>Show studios</ng-container>
    }
  </button>
</st-sheet>
