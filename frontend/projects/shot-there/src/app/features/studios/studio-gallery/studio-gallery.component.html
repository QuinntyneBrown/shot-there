<section class="review-section" aria-labelledby="gallery">
  <div class="section-head">
    <h2 id="gallery" i18n>From a real shoot</h2>
    <span class="text-caption" i18n>{gallery().length, plural, =1 {1 photo} other {{{gallery().length}} photos}}</span>
  </div>
  <st-shot-grid [shots]="shots()" (shotActivated)="open($event)" />
</section>
