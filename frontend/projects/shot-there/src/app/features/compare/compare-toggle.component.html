<button st-button [size]="'sm'" [pressed]="selected()" type="button" (click)="toggle()">
  @if (selected()) {
    <ng-container i18n>Remove<span class="visually-hidden"> {{ name() }}</span></ng-container>
  } @else {
    <ng-container i18n>Compare<span class="visually-hidden"> {{ name() }}</span></ng-container>
  }
</button>
