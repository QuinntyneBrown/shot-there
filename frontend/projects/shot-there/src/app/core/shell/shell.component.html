<st-skip-link />
<st-site-header
  role="banner"
  [brand]="headerBrand"
  [brandTag]="headerBrandTag"
  [homeLink]="headerHomeLink"
  [links]="headerLinks"
  [navLabel]="headerNavLabel"
  [menuExpanded]="menuOpen()"
  (menuToggled)="openMenu()"
/>
<main id="main" class="container" tabindex="-1">
  <router-outlet />
</main>
<st-site-footer
  role="contentinfo"
  [brand]="footerBrand"
  [tagline]="footerTagline"
  [links]="footerLinks"
  [navLabel]="footerNavLabel"
  [copy]="footerCopy"
  [externalHint]="externalHint"
>
  <app-email-signup slot="signup" i18n-slot variant="footer" />
</st-site-footer>
@if (selection.count() > 0) {
  <st-compare-bar
    [label]="compareBarLabel"
    [countText]="compareBarCountText()"
    [hint]="compareBarHint()"
    [names]="compareBarNames()"
  >
    <button
      st-button
      slot="actions"
      i18n-slot
      variant="ghost"
      type="button"
      (click)="selection.clear()"
      i18n
    >
      Clear
    </button>
    <button
      st-button
      slot="actions"
      i18n-slot
      variant="primary"
      type="button"
      [disabled]="!selection.canCompare()"
      [attr.aria-describedby]="selection.canCompare() ? null : 'compare-hint'"
      (click)="compare()"
      i18n
    >
      Compare
    </button>
  </st-compare-bar>
}
<st-toast-region />
