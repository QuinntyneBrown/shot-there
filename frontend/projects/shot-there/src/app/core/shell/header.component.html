<header class="site-header">
  <a class="wordmark" routerLink="/"
    ><ng-container i18n>ShotThere</ng-container> <span class="wordmark__tag" i18n>Toronto</span></a
  >
  <nav class="site-nav" aria-label="Primary" i18n-aria-label>
    @for (link of links; track link.path) {
      <a
        class="site-nav__link site-nav__extra"
        [routerLink]="link.path"
        routerLinkActive
        ariaCurrentWhenActive="page"
        >{{ link.label }}</a
      >
    }
  </nav>
  <button
    type="button"
    class="btn btn--ghost site-nav__menu"
    aria-haspopup="dialog"
    [attr.aria-expanded]="menuOpen()"
    (click)="openMenu()"
  >
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
    <ng-container i18n>Menu</ng-container>
  </button>
</header>
